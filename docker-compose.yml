services:
  postgres:
    image: postgres:16-alpine
    container_name: drizzle-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 123
      POSTGRES_DB: rnd_template
    volumes:
      - drizzle_postgres_data:/var/lib/postgresql/data

volumes:
  drizzle_postgres_data:

